{% load static %}

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de Sesión</title>

    <link rel="stylesheet" href="{% static 'usuario/css/login.css' %}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  </head>

  <body>
    <div class="background"></div>

    <div class="login-container">
      <div class="login-card">
        <img
          src="{% static 'usuario/images/HephysSinPluma.png' %}"
          alt="Logo"
          class="logo"
        />

        <h1>Inicio de Sesión</h1>
        <br />

        <form method="POST">
          {% csrf_token %}

          <div class="input-group">
            <label>Matrícula/Usuario</label>
            <input
              type="text"
              name="matricula"
              placeholder="S21000000"
              required
            />
          </div>

          <div class="input-group campo-password">
            <label>Contraseña</label>
            <input type="password" name="password" id="id_password" required />
            <button type="button" class="btn-toggle-password" data-mostrar-password="id_password" aria-label="Mostrar contraseña">
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <button type="submit">Iniciar Sesión</button>
        </form>

        <div class="seccion-crear-cuenta">
          <p class="texto-sin-cuenta">
            ¿No tienes una cuenta?
          </p>
          <a
            href="{% url 'usuario:registrar_alumno' %}"
            class="btn-secundario"
          >
            Crear cuenta
          </a>
        </div>

        <span class="footer-text">Universidad Veracruzana</span>
      </div>
    </div>

    {% if messages %}
    <div class="modal-overlay" id="errorModal">
      <div class="modal-error">
        <div class="icono-error">✕</div>

        <h2>Error</h2>

        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}

        <button type="button" id="btnCerrarError">Aceptar</button>
      </div>
    </div>
    {% endif %}

    <script src="{% static 'usuario/js/mostrar_password.js' %}"></script>
    <script src="{% static 'usuario/js/login.js' %}"></script>
  </body>
</html>
